baseURL = "https://gowreesh-mago.github.io/hava_website/"
languageCode = "en"
title = "HAVA-Lab"
disableKinds = ["RSS", "taxonomy", "term"]

[params]
  description = "Human-Aligned Video AI Laboratory - UvA Data Science Centre"
  ogImage = "/media/og-image.jpg"
  location = "University Library Singel, Amsterdam"
  contactEmail = "c.g.m.snoek@uva.nl"
  # How many items the home page shows before linking to the full list
  pubsOnHome = 5
  eventsOnHome = 4

[menu]
