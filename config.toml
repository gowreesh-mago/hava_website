  [[menu.main]]
    name = "Team"
    pageRef = "/team"
    weight = 3
  [[menu.main]]
    name = "Publications & News"
    pageRef = "/publications"
    weight = 4
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 5
  [[menu.main]]
    name = "Media"
    pageRef = "/media"
    weight = 6

