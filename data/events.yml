#
# Fields:
#   title        required
#   date         required, YYYY-MM-DD
#   kind         e.g. Faculty-focus, Workshop, Conference, Away day, Talk
#   time         optional, e.g. "16:00" or "10:00–16:00"
#   location     optional
#   speaker      optional, who presents
#   description  optional, one or two sentences
#   link         optional, invite / registration / recap URL
#   linkLabel    optional, button text (defaults to "Register" for upcoming, "Recap" for past)

