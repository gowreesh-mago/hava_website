# Everyone in the lab, in display order. Drives the Team page and the
# "Supervised by" credits on Projects. Photos live in static/images/.
#
# Per person:
#   name          no academic titles
#   photo         path under static/
#   affiliations  keys from the `affiliations` map below (shown as original logo images)
#   website       PhDs only, optional personal page
#   supervisors   PhDs only, exact names of PIs listed below
#
# Affiliation colours follow the UvA corporate identity where one exists
# (uva.nl > corporate identity > colour). Units without an official UvA
# colour use a neutral or their own institution's colour. `logo` is the
# official logo (UvA second-layer logos; AUMC, ACTA and VU from their sites).

affiliations:
