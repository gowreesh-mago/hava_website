# Everything the lab does in public: events, talks, posters, press,
# spotlights and achievements. One entry per item; the site sorts them,
# upcoming first, then newest first. Home shows the latest few.
#
# Fields:
#   title     required
#   date      YYYY-MM-DD; omit for ongoing service without a verified start date
#   type      Event | Talk | Poster | Press | Spotlight | Achievement | Series
#   outlet    optional, where it appeared or who hosted it
#   location  optional
#   summary   optional, one or two sentences
#   link      optional, URL
#   linkLabel optional, button text (default "Open")
#   image     optional, path under static/
#   imageAlt  optional
#   vimeo     optional, Vimeo id with hash, e.g. "1019799056/9c9ead1f9c"

