{{ define "main" }}
{{ partial "page-hero.html" . }}
{{ if .Pages }}
<div class="post-list">
  {{ range .Pages.ByDate.Reverse }}
  <a class="post-row" href="{{ .RelPermalink }}">
    <span class="mono">{{ .Date.Format "02 Jan 2006" }}</span>
    <div>
      <h3>{{ .Title }}</h3>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </div>
    <span class="mono red">Read &rarr;</span>
  </a>
  {{ end }}
</div>
{{ end }}
{{ end }}
