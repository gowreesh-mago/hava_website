{{ define "page-styles" }}
{{ $css := resources.Get "css/mission.css" | minify }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
{{ end }}

{{ define "main" }}
<div class="mission-page">
{{ partial "page-hero.html" . }}
{{ with .Params.objectives }}
<nav class="mission-objectives" aria-label="Research objectives">
  <ul>
    {{ range . }}
    <li><a href="{{ .link | relURL }}">{{ .title }}</a></li>
    {{ end }}
  </ul>
</nav>
{{ end }}
<article class="prose">
  {{ .Content }}
</article>
</div>
{{ end }}
