{{- $id := .Get "id" | default (.Get 0) -}}
<div class="video-embed">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ $id }}" title="{{ .Get "title" | default "YouTube video" }}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
