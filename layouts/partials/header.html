<header class="site-header" role="banner">
  <a href="{{ .Site.Home.RelPermalink }}" class="site-title">
    <span class="wordmark">HAVA</span>
    <span class="tagline">Human-Aligned Video AI · UvA Data Science Centre</span>
  </a>
  <button class="nav-toggle" aria-expanded="false" aria-controls="main-nav">Menu</button>
  <nav id="main-nav" class="main-nav" role="navigation" aria-label="Main navigation">
    {{ range .Site.Menus.main }}
    <a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
