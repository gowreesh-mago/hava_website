<title>{{ if .IsHome }}{{ .Site.Title }} — Human-Aligned Video AI Laboratory{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
{{ $image := (.Params.image | default .Site.Params.ogImage) | absURL }}
{{ if not .Params.image }}
  {{ with .Site.Data.gallery }}
    {{ with resources.Get (index . 0).image }}{{ $image = (.Fill "1200x630 webp q85").Permalink }}{{ end }}
  {{ end }}
{{ end }}
<meta property="og:image" content="{{ $image }}">
<meta name="twitter:image" content="{{ $image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
